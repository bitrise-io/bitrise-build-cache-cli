format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: g2.linux.medium
    # Pin to US region — AMS mirror has been passing through Maven Central 429s
    # (postmortem: https://bitrise.atlassian.net/wiki/spaces/INCIDENT/pages/4980998155).
    machine_region: region-us

app:
  envs:
  - PANDOC_VERSION: "3.6.2"
  - MAVEN_VERSION: "3.9.9"
    # These are needed for the E2E test assertion logic
  - WORKSPACE_SLUG: 322a005426441b60
  - MONOLITH_API_PAT: $BITRISE_BUILD_CACHE_AUTH_TOKEN
  - TRIGGERED_BUILD_SLUG: $BITRISE_BUILD_SLUG
    # Pinned because a backend "baseline" answer disables the cache outright,
    # failing every cache assertion here for an unrelated reason.
  - BITRISE_BUILD_CACHE_BENCHMARK_PHASE_GRADLE: established
  - BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE: established
  - BITRISE_BUILD_CACHE_BENCHMARK_PHASE_BAZEL: established

include:
- path: bitrise_rn_config/bitrise.yml

workflows:
  release:
    description: |
      Creates Linux and Darwin binaries, publishes a GitHub release, and
      mirrors artifacts to GAR. NOT triggered directly by a tag; the
      `release-and-verify` pipeline fans this out → `verify-release`.
    envs:
    - GITHUB_TOKEN: $GIT_BOT_USER_ACCESS_TOKEN
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8:
        inputs:
        - fetch_tags: "yes"
    - script@1:
        title: asdf use latest go
        inputs:
        - content: |-
            #!/usr/bin/env bash

            asdf install golang 1.26.8
            asdf global golang 1.26.8
    - script:
        title: Install Goreleaser
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex

            GOBIN=/usr/local/bin/ go install github.com/goreleaser/goreleaser/v2@latest
    - bundle::generate_gradle_verification_reference: { }
    - bundle::check_gradle_verification_reference: { }
    - script:
        title: Goreleaser (create binaries + publish to GH)
        deps:
          brew:
          - name: goreleaser
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex

            # Homebrew formula generation has been removed from .goreleaser.yaml
            # and moved to a dedicated, non-fatal shell step further down that
            # writes Formula/bitrise-build-cache.rb directly to the tap repo
            # from dist/checksums.txt. This keeps the GH release + GAR mirror
            # (the critical path) free of any brew-related work.
            goreleaser release
    - script:
        title: Authenticate to GCP
        inputs:
          - content: |-
              #!/bin/bash
              set -euxo pipefail
              KEY_FILE_PATH=$(mktemp -d)/keyfile.json
              echo "${GAR_SERVICE_ACCOUNT_B64}" | base64 --decode > ${KEY_FILE_PATH}
              gcloud auth activate-service-account --key-file=${KEY_FILE_PATH}
    - script:
        title: Upload release artifacts to GAR
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            ./scripts/gar_upload_release_artifacts.sh
    - script:
        title: Upload release artifacts to R2
        deps:
          brew:
          - name: awscli
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            ./scripts/r2_upload_release_artifacts.sh
    - script:
        title: Mirror ccache binaries to GAR
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            ./scripts/gar_mirror_ccache.sh
    - script:
        title: Mirror install/installer.sh to GAR
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            ./scripts/gar_mirror_installer.sh
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
          - deploy_path: "$GRADLE_VERIFICATION_REF_TARGET_PATH"
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
          - deploy_path: "$GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH"
    - script:
        title: Publish Homebrew formula (non-fatal)
        is_skippable: true
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            ./scripts/publish_homebrew_formula.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-gradle-remote-cache
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_remote_cache.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-gradle-features
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_features.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-build-cache-for-xcode
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_build_cache_for_xcode.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-react-native-features
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_react_native_features.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-gradle-mirrors
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_mirrors.sh
    - bundle::update-step:
        envs:
        - STEP_NAME: bitrise-step-activate-build-cache-for-bazel
        - UPDATE_SCRIPT_PATH: ../scripts/update_activate_build_cache_for_bazel.sh
    - slack@4:
        inputs:
          - channel: "#team-advanced-ci-alerts-website"
          - text: |-
              CLI release failed! :gopher_lift: :rotating_light:

              Check build here: $BITRISE_BUILD_URL
          - emoji: ":rotating_light:"
          - color: "#ee003b"
          - webhook_url: "$SLACK_WEBHOOK_ALERTS"
        title: Send slack if failed
        run_if: ".IsBuildFailed"
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
        stack: osx-xcode-edge

  verify-release:
    description: |
      End-to-end verification of the install pipeline against the
      just-published artifacts. Runs scripts/verify_release.sh which:
        1. installs via raw.githubusercontent.com, asserts version == tag
        2. diffs the GAR-mirrored installer.sh (pinned + latest-pointer)
           against the in-tree copy + asserts latest-pointer:VERSION == tag
        3. temporarily blocks github.com via /etc/hosts and re-runs
           installer.sh — forces both tag resolution AND binary download
           through GAR. /etc/hosts is restored via `trap` on exit.
      Pinned to macOS: fresh VM per build, so /etc/hosts mutations are
      contained. Posts to Slack on failure. Retry-safe (independent of
      the release workflow).
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
        stack: osx-xcode-edge
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8:
        inputs:
        - fetch_tags: "yes"
    - script:
        title: Verify release end-to-end (GH + GAR install paths)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            ./scripts/verify_release.sh
    - slack@4:
        inputs:
          - channel: "#team-advanced-ci-alerts-website"
          - text: |-
              CLI release verification FAILED for $BITRISE_GIT_TAG! :rotating_light:

              The release artifacts may be broken or unreachable via GAR.
              Check build: $BITRISE_BUILD_URL

              The release workflow itself succeeded — retry this workflow once the issue is fixed (no need to re-cut the tag).
          - emoji: ":rotating_light:"
          - color: "#ee003b"
          - webhook_url: "$SLACK_WEBHOOK_ALERTS"
        title: Send slack if failed
        run_if: ".IsBuildFailed"

  bump-prefix:
    description: |
      Open PRs against bitrise-io/internal-platform-services bumping the pinned
      bitrise-build-cache CLI version + per-arch sha256 in the instance-manager
      VM startup prefix (staging first, then production), wait for each PR's
      checks and merge it as the Bitrise Infrabot. Terraform applies the
      ConfigMap on merge. Chained after verify-release. Safe to retry: a branch already at the tag is skipped.
    envs:
    - IPS_BOT_TOKEN: $IPS_BOT_TOKEN
    meta:
      bitrise.io:
        machine_type_id: g2.linux.medium
        stack: linux-docker-android-22.04
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8:
        inputs:
        - tag: ""
        - branch: main
    - script:
        title: Open prefix bump PRs
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            ./scripts/prefix_pr_bump.sh
    - slack@4:
        inputs:
          - channel: "#team-advanced-ci-alerts-website"
          - text: |-
              VM startup prefix bump FAILED for $BITRISE_GIT_TAG! :rotating_light:

              Could not open / merge the bump PRs to bitrise-io/internal-platform-services.
              Check build: $BITRISE_BUILD_URL

              The release itself succeeded — retry this workflow once the issue is fixed (no need to re-cut the tag).
          - emoji: ":rotating_light:"
          - color: "#ee003b"
          - webhook_url: "$SLACK_WEBHOOK_ALERTS"
        title: Send slack if failed
        run_if: ".IsBuildFailed"

  rde-mac-local-dx-smoke:
    description: |
      On-demand: provision a Bitrise Remote Dev Environment (RDE) mac
      session, install the CLI into it via installer.sh, run `doctor`,
      and permanently delete the session. Exercises the local-dev
      experience surfaces (installer + doctor on a fresh mac) that
      regular Bitrise steps can't cover — those run inside pre-baked
      worker images and never simulate a first-time user install.

      Uses the RDE HTTP API (https://api.bitrise.io/rde) with a Bearer
      token (RDE_BITRISE_PAT) — the same endpoints bitrise-cli's
      internal/rde package hits. SSH auth is password-based; the session
      record carries sshAddress + sshPassword after RUNNING.

      Wired into the features-e2e PR pipeline; also triggerable on demand.
    envs:
    - RDE_STACK_ID: osx-xcode-edge
    - RDE_MACHINE_TYPE: g2.mac.m2pro.6c-14g
    - RDE_SMOKE_GOOS: darwin
    - RDE_SMOKE_GOARCH: arm64
    meta:
      bitrise.io:
        machine_type_id: g2.linux.medium
        stack: linux-docker-android-22.04
    steps:
    - bundle::rde-smoke-prep: {}
    - script:
        title: RDE mac smoke test (installer.sh + doctor)
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            ./scripts/rde_smoke_test.sh

  rde-linux-local-dx-smoke:
    description: |
      Linux twin of rde-mac-local-dx-smoke. Same script, but the
      xcodebuild-wrapper scenario is skipped (macOS-only) and the
      no-supervision assertion checks systemctl --user instead of
      launchctl. See scripts/rde_smoke_test.sh for the OS-branching logic.

      Wired into the features-e2e PR pipeline; also triggerable on demand.
    envs:
    - RDE_STACK_ID: ubuntu-resolute-26.04-bitrise-2026-android
    - RDE_MACHINE_TYPE: g2.linux.amd-zen4.2c-8g
    - RDE_SMOKE_GOOS: linux
    - RDE_SMOKE_GOARCH: amd64
    meta:
      bitrise.io:
        machine_type_id: g2.linux.medium
        stack: linux-docker-android-22.04
    steps:
    - bundle::rde-smoke-prep: {}
    - script:
        title: RDE linux smoke test
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            ./scripts/rde_smoke_test.sh

  test:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: asdf use latest go
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            asdf install golang 1.26.8
            asdf global golang 1.26.8
    - go-list@1: {}
    - script@1:
        title: golangci-lint
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            make lint
    - go-test@1: {}
    - script@1:
        title: prefix bump script tests
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            ./scripts/prefix_pr_bump_test.sh
    - script@1:
        title: integration tests
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            make test-integration
    - bundle::generate_gradle_verification_reference: { }
    - bundle::check_gradle_verification_reference: { }
    - deploy-to-bitrise-io@2:
        inputs:
          - deploy_path: "$GRADLE_VERIFICATION_REF_TARGET_PATH"
    - deploy-to-bitrise-io@2:
        inputs:
          - deploy_path: "$GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH"
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
        stack: osx-xcode-edge

  pr-release-check-linux:
    description: |
      PR dry-run of the release flow on Linux. See bundle::release-flow-check.
    meta:
      bitrise.io:
        machine_type_id: g2.linux.medium
        stack: linux-docker-android-22.04
    steps:
    - bundle::release-flow-check: {}

  pr-release-check-mac:
    description: |
      PR dry-run of the release flow on macOS. See bundle::release-flow-check.
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
        stack: osx-xcode-edge
    steps:
    - bundle::release-flow-check: {}

  generate_gradle_verification:
    steps:
    - bundle::generate_gradle_verification_reference: { }

  generate_and_commit_dependency_matrix:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8:
        inputs:
          - fetch_tags: "yes"
          - shallow_clone: "false"
          - clone_depth: "-1"
    - bundle::generate_and_commit_dependency_matrix: {}
    - slack@4:
        inputs:
          - channel: "#team-advanced-ci-alerts-website"
          - text: |-
              Dependency matrix generation failed! :matrix-code: :rotating_light:

              Check build here: $BITRISE_BUILD_URL
          - emoji: ":rotating_light:"
          - color: "#ee003b"
          - webhook_url: "$SLACK_WEBHOOK_ALERTS"
        title: Send slack if failed
        run_if: ".IsBuildFailed"

  update_plugins:
    envs:
      - GITHUB_TOKEN: $GIT_BOT_USER_ACCESS_TOKEN
    steps:
      - activate-ssh-key@4:
            run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
          - fetch_tags: "yes"
          - shallow_clone: "false"
          - clone_depth: "-1"
      - script@1:
          title: Change apt sources to enzu mirror
          inputs:
            - content: |-
                #!/usr/bin/env bash

                sed -i.bak 's|http://archive.ubuntu.com/ubuntu/|https://mirror.enzu.com/ubuntu/|g' /etc/apt/sources.list
      - apt-get-install:
          inputs:
            - packages: libxml2-utils
      - script:
          title: Ensure we're on main
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                git fetch origin
                if [[ "$BITRISE_GIT_BRANCH" != "main" ]]; then
                  git checkout main
                  git pull origin main
                fi
      - script:
          title: Update plugins with latest version
          inputs:
            - content: |
                bash ./scripts/update_plugins.sh
      - bundle::generate_gradle_verification_reference: {}
      - script:
          title: Commit updated plugins and open PR
          inputs:
            - content: |
                set -ex

                # Check for existing PR with the same title
                existing_pr=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/bitrise-io/bitrise-build-cache-cli/pulls?state=open" | jq -r ".[] | select(.title == \"chore: Update Gradle plugins\") | .html_url")

                if [ -n "$existing_pr" ]; then
                  echo "A pull request with this title already exists: $existing_pr"
                  exit 0
                fi

                if [ -n "$(git status --porcelain)" ]; then
                  git branch -D update-plugins || true
                  git checkout -b update-plugins

                  git add .
                  git commit -m "feat: update plugins to release"
                  git push -f origin update-plugins

                  # Create a pull request using GitHub API
                  pr_response=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                    -d "{\"title\":\"chore: Update Gradle plugins\",\"body\":\"This PR updates the Gradle plugins.\",\"head\":\"update-plugins\",\"base\":\"main\"}" \
                    "https://api.github.com/repos/bitrise-io/bitrise-build-cache-cli/pulls")

                    pr_url=$(echo "$pr_response" | jq -r .html_url)
                    envman add --key PR_URL --value "$pr_url"

                    if [ "$pr_url" != "null" ]; then
                      echo "Pull request created successfully: $pr_url"
                    else
                      echo "Failed to create pull request. Response: $pr_response"
                      exit 1
                    fi
                else
                  echo "No changes detected, skipping commit."
                  exit 0
                fi
      - slack@4:
          inputs:
            - channel: "#team-advanced-ci-alerts-website"
            - text: |-
                Gradle plugin update PR is ready! :tada: :rocket: :gradle:

                Check PR here: $PR_URL
            - emoji: ":gradle:"
            - color: "#08a045"
            - webhook_url: "$SLACK_WEBHOOK_ALERTS"
          title: Send slack if PR opened
          run_if: '{{ getenv "PR_URL" | ne "" }}'
      - slack@4:
          inputs:
            - channel: "#team-advanced-ci-alerts-website"
            - text: |-
                CLI plugin update failed! :gradle: :gopher_lift: :rotating_light:

                Check build here: $BITRISE_BUILD_URL
            - emoji: ":rotating_light:"
            - color: "#ee003b"
            - webhook_url: "$SLACK_WEBHOOK_ALERTS"
          title: Send slack if failed
          run_if: ".IsBuildFailed"

  dispatch-e2e-cli:
    description: |
      Public-side e2e entry point. Triggers the private `features-e2e`
      pipeline on build-cache-e2e-testing, passes this PR's commit as
      CLI_COMMIT, polls terminal status, prints per-workflow summary +
      the private pipeline URL, mirrors status as the public build's
      exit code.
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: g2.linux.medium
    envs:
    - E2E_TESTING_APP_SLUG: b7474eca-d89f-45e0-ac45-3f2884c2b661
    - E2E_TESTING_REPO: git@github.com:bitrise-io/build-cache-e2e-testing.git
    - E2E_TESTING_BRANCH: master
    - E2E_PIPELINE: features-e2e
    steps:
    - bundle::dispatch-to-private: {}

  update-steps:
    envs:
        - GITHUB_TOKEN: $GIT_BOT_USER_ACCESS_TOKEN
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - fetch_tags: "yes"
      - script@1:
          title: asdf use latest go
          inputs:
            - content: |-
                #!/usr/bin/env bash

                asdf install golang 1.26.8
                asdf global golang 1.26.8
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-gradle-remote-cache
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_remote_cache.sh
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-gradle-features
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_features.sh
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-build-cache-for-xcode
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_build_cache_for_xcode.sh
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-react-native-features
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_react_native_features.sh
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-gradle-mirrors
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_gradle_mirrors.sh
      - bundle::update-step:
          envs:
            - STEP_NAME: bitrise-step-activate-build-cache-for-bazel
            - UPDATE_SCRIPT_PATH: ../scripts/update_activate_build_cache_for_bazel.sh

step_bundles:
  dispatch-to-private:
    description: Shared dispatcher body — see dispatch-e2e-cli for details.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - script:
        title: Resolve paired e2e branch (ls-remote)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            : "${E2E_TESTING_REPO:?missing E2E_TESTING_REPO}"
            : "${E2E_TESTING_BRANCH:?missing E2E_TESTING_BRANCH}"

            pr_branch="${BITRISE_GIT_BRANCH:-}"
            resolved="$E2E_TESTING_BRANCH"

            if [[ -n "$pr_branch" && "$pr_branch" =~ ^[A-Za-z0-9._/-]{1,255}$ ]]; then
              if git ls-remote --exit-code --heads "$E2E_TESTING_REPO" "$pr_branch" >/dev/null 2>&1; then
                resolved="$pr_branch"
                echo "Paired e2e branch found: $resolved"
              else
                echo "No paired branch '$pr_branch' on e2e repo — using $E2E_TESTING_BRANCH"
              fi
            else
              echo "PR branch '${pr_branch}' failed sanitization — using $E2E_TESTING_BRANCH"
            fi

            envman add --key E2E_RESOLVED_BRANCH --value "$resolved"
    - git::https://github.com/bitrise-steplib/bitrise-step-get-identity-token.git@main:
        title: Mint OIDC identity token for receiver app
        inputs:
        - audience: app.bitrise.io
    - script:
        title: Exchange identity token for short-lived receiver WAT
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            : "${BITRISE_IDENTITY_TOKEN:?get-identity-token step did not set BITRISE_IDENTITY_TOKEN}"
            : "${E2E_RECEIVER_OIDC_POLICY_ID:?missing E2E_RECEIVER_OIDC_POLICY_ID}"

            response=$(curl -sS -X POST --max-time 30 \
              -w "\nHTTP_STATUS:%{http_code}" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "subject_token_type=id_token" \
              --data-urlencode "policy_id=$E2E_RECEIVER_OIDC_POLICY_ID" \
              --data-urlencode "subject_token=$BITRISE_IDENTITY_TOKEN" \
              "https://app.bitrise.io/oidc/token")
            http_status=$(echo "$response" | awk -F: '/^HTTP_STATUS:/ {print $2}')
            body=$(echo "$response" | sed '/^HTTP_STATUS:/d')
            if [[ "$http_status" != "200" ]]; then
              echo "OIDC exchange failed (HTTP $http_status): ${body:0:500}"
              exit 1
            fi
            token=$(echo "$body" | jq -r '.access_token')
            ttl=$(echo "$body" | jq -r '.expires_in // "unknown"')
            if [[ -z "$token" || "$token" == "null" ]]; then
              echo "OIDC exchange: no access_token in response: ${body:0:500}"
              exit 1
            fi
            echo "Minted short-lived receiver WAT (expires in ${ttl}s)"
            envman add --key RECEIVER_WAT --value "$token" --sensitive
    - script:
        title: Dispatch + wait for private pipeline
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            : "${E2E_TESTING_BUILD_TRIGGER_TOKEN:?missing trigger token}"
            : "${BITRISE_GIT_COMMIT:?no commit to run e2e on}"
            : "${E2E_PIPELINE:?missing E2E_PIPELINE}"
            : "${E2E_TESTING_APP_SLUG:?missing E2E_TESTING_APP_SLUG}"
            : "${E2E_RESOLVED_BRANCH:?missing E2E_RESOLVED_BRANCH (resolve step must run first)}"
            : "${RECEIVER_WAT:?missing RECEIVER_WAT (OIDC exchange step must run first)}"

            payload=$(jq -nc \
              --arg token "$E2E_TESTING_BUILD_TRIGGER_TOKEN" \
              --arg branch "$E2E_RESOLVED_BRANCH" \
              --arg pipeline "$E2E_PIPELINE" \
              --arg commit "$BITRISE_GIT_COMMIT" \
              --arg triggered_by "cli-dispatcher-$BITRISE_BUILD_SLUG" \
              '{
                hook_info: {type: "bitrise", build_trigger_token: $token},
                build_params: {
                  branch: $branch,
                  pipeline_id: $pipeline,
                  environments: [
                    {mapped_to: "CLI_COMMIT", value: $commit, is_expand: false}
                  ]
                },
                triggered_by: $triggered_by
              }')

            resp=$(curl -sS -X POST --max-time 60 \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "https://app.bitrise.io/app/$E2E_TESTING_APP_SLUG/build/start.json")
            echo "Dispatch response: $resp"
            priv_slug=$(echo "$resp" | jq -r '.build_slug')
            if [[ -z "$priv_slug" || "$priv_slug" == "null" ]]; then
              echo "No build_slug in response"; exit 1
            fi
            priv_url="https://app.bitrise.io/app/$E2E_TESTING_APP_SLUG/pipelines/$priv_slug"
            echo "Private pipeline: $priv_url"

            abort_private() {
              if [[ -z "${priv_slug:-}" ]]; then
                echo "abort_private: no slug to abort (skipping)"
                return 0
              fi
              local reason="${1:-dispatcher terminated}"
              echo "Aborting private pipeline $priv_slug: $reason"
              curl -sS -w "\nHTTP %{http_code}" -X POST --max-time 30 \
                -H "Authorization: $RECEIVER_WAT" \
                -H 'Content-Type: application/json' \
                "https://api.bitrise.io/v0.1/apps/$E2E_TESTING_APP_SLUG/pipelines/$priv_slug/abort" \
                -d "{\"abort_reason\":\"$reason\",\"abort_with_success\":false,\"skip_notifications\":true}" || true
              echo
            }
            render_summary() {
              echo
              echo "=== Per-workflow results (private pipeline $priv_slug) ==="
              if [[ -z "$info_ok" ]]; then
                echo "(no pipeline info captured before exit)"
              else
                echo "$info_ok" | jq -r '
                  [.workflows[]?, .stages[]?.workflows[]?][]
                  | "\(if (.status == "succeeded" or .status == "succeeded_with_abort") then "✓" elif .status == "skipped" then "·" else "✗" end) \(.name) [\(.status)] — https://app.bitrise.io/app/'"$E2E_TESTING_APP_SLUG"'/build/\(.external_id // "?")"
                ' || echo "(could not parse pipeline detail)"
              fi
              echo
              echo "Private pipeline URL: $priv_url"
            }
            trap 'abort_private "public dispatcher received TERM/INT"; exit 130' TERM INT

            SECONDS=0
            BUDGET_MINUTES=90
            BUDGET=$((BUDGET_MINUTES*60))
            info_ok=""
            while :; do
              if (( SECONDS > BUDGET )); then
                echo "DISPATCHER TIMEOUT: watched ${SECONDS}s (>${BUDGET}s), aborting watch"
                abort_private "dispatcher wall-clock budget exceeded"
                render_summary
                exit 1
              fi
              info_resp=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" --retry 3 --retry-all-errors --retry-connrefused --max-time 30 \
                -H "Authorization: $RECEIVER_WAT" \
                "https://api.bitrise.io/v0.1/apps/$E2E_TESTING_APP_SLUG/pipelines/$priv_slug" || echo $'\nHTTP_STATUS:000')
              http_status=$(echo "$info_resp" | awk -F: '/^HTTP_STATUS:/ {print $2}')
              info=$(echo "$info_resp" | sed '/^HTTP_STATUS:/d')
              if [[ "$http_status" =~ ^4 ]]; then
                echo "Polling failed (HTTP $http_status) — auth or pipeline-id problem, aborting:"
                echo "$info"
                abort_private "dispatcher gave up on HTTP $http_status"
                render_summary
                exit 1
              fi
              if ! echo "$info" | jq -e '.status' >/dev/null 2>&1; then
                sleep 20
                continue
              fi
              info_ok=$info
              status=$(echo "$info" | jq -r '.status')
              case "$status" in
                succeeded|succeeded_with_abort|failed|aborted) break ;;
                *) sleep 20 ;;
              esac
            done
            trap - TERM INT

            render_summary
            echo "Overall status: $status"

            case "$status" in
              succeeded|succeeded_with_abort) exit 0 ;;
              *) exit 1 ;;
            esac

  rde-smoke-prep:
    description: |
      Shared prep for the rde-mac-local-dx-smoke + rde-linux-local-dx-smoke
      workflows: clone, install sshpass, resolve the CLI tag from git,
      build the branch binary for RDE_SMOKE_GOOS/RDE_SMOKE_GOARCH so the
      smoke exercises this PR's code rather than the last released tag.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script:
        title: Install sshpass
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            command -v sshpass >/dev/null || sudo apt-get install -y sshpass
    - script:
        title: Resolve latest CLI tag from git
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            git fetch --tags --quiet origin || true
            TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || git describe --tags --abbrev=0)
            echo "resolved CLI tag: $TAG"
            envman add --key RDE_SMOKE_CLI_TAG --value "$TAG"
    - script:
        title: Build branch CLI binary — smoke tests PR code, not last release
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -e
            out=/tmp/bbc-branch-${RDE_SMOKE_GOOS}-${RDE_SMOKE_GOARCH}
            GOOS="$RDE_SMOKE_GOOS" GOARCH="$RDE_SMOKE_GOARCH" CGO_ENABLED=0 go build -o "$out" .
            ls -la "$out"
            envman add --key BRANCH_BINARY_PATH --value "$out"

  release-flow-check:
    description: |
      Dry-run of the release flow. Verifies install/installer.sh still works
      against the current GitHub `latest` release and that goreleaser can
      produce a full snapshot build with the current .goreleaser.yaml. Then
      runs `version` on the just-built binary for the host platform.
      Nothing is published. Used by pr-release-check-linux and -mac.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: asdf use latest go
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            asdf install golang 1.26.8
            asdf global golang 1.26.8
    - script:
        title: Syntax-check installer.sh (POSIX sh)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            # installer.sh runs under /bin/sh on every Bitrise stack (alpine
            # included). Catch non-POSIX syntax before it ships.
            sh -n install/installer.sh
    - script:
        title: Run installer.sh end-to-end (latest GH release)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            # Exercise the same code path every Bitrise build hits: resolve
            # `latest`, download from GH (with GAR fallback), verify checksum,
            # extract, install. Then smoke-test the resulting binary.
            rm -rf ./bin-installer-check
            sh install/installer.sh -b ./bin-installer-check
            ./bin-installer-check/bitrise-build-cache version
    - script:
        title: Install Goreleaser
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            GOBIN=/usr/local/bin/ go install github.com/goreleaser/goreleaser/v2@latest
    - script:
        title: goreleaser check (config validation)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            goreleaser check
    - script:
        title: goreleaser snapshot (dry-run, no publish)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            # --snapshot:     no tag required
            # --clean:        wipe ./dist between runs
            # --skip=publish: never touch GitHub / Homebrew / GAR
            goreleaser release --snapshot --clean --skip=publish
            ls -laR dist

            # Smoke-test the just-built binary for the current platform.
            # goreleaser snapshot lays binaries out at:
            #   dist/<project>_<os>_<arch>[_v<variant>]/<binary>
            host_os=$(uname -s | tr '[:upper:]' '[:lower:]')
            host_arch=$(uname -m)
            case "$host_arch" in
              x86_64) host_arch=amd64 ;;
              aarch64) host_arch=arm64 ;;
            esac
            built_binary=$(find dist -type f -name bitrise-build-cache \
              -path "*_${host_os}_${host_arch}*/*" | head -n1)
            if [ -z "$built_binary" ]; then
              echo "Could not locate built binary for ${host_os}/${host_arch} in dist/"
              exit 1
            fi
            echo "Running snapshot binary: $built_binary"
            "$built_binary" version

  generate_gradle_verification_reference:
    steps:
    - script:
        title: Generate Gradle verification reference
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            # Backup $HOME/.gradle/init.d/bitrise-build-cache.init.gradle.kts
            GRADLE_INIT_PATH=$HOME/.gradle/init.d/bitrise-build-cache.init.gradle.kts
            if [[ -f "$GRADLE_INIT_PATH" ]]; then
              mv $GRADLE_INIT_PATH $GRADLE_INIT_PATH.backup
            fi

            go build -o /tmp/bin/bitrise-build-cache-cli

            SAMPLE_PATH=$(realpath ./gradle_verification_sample)
            GRADLE_VERIFICATION_REF_PATH=$SAMPLE_PATH/gradle/verification-metadata.xml
            GRADLE_VERIFICATION_REF_TARGET_PATH=$(realpath ./cmd/gradle/asset/verification-metadata.xml)
            GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH=$(realpath ./cmd/gradle/asset/verification-metadata-mirror.xml)

            # add plugin with CLI
            cd "$SAMPLE_PATH"
            /tmp/bin/bitrise-build-cache-cli -d gradle-verification add-reference-deps

            # generate xml against the original repos (no mirror)
            rm -f "$SAMPLE_PATH/gradle/verification-metadata.xml"
            ./gradlew --write-verification-metadata sha256 help

            cat $GRADLE_VERIFICATION_REF_PATH
            echo "Generated verification xml: $GRADLE_VERIFICATION_REF_PATH"

            # Copy metadata to be included in the CLI binary
            mv -f "$GRADLE_VERIFICATION_REF_PATH" "$GRADLE_VERIFICATION_REF_TARGET_PATH"
            envman add --key GRADLE_VERIFICATION_REF_TARGET_PATH --value "$GRADLE_VERIFICATION_REF_TARGET_PATH"

            # generate xml against the Bitrise Maven mirror
            export BITRISE_MAVENCENTRAL_PROXY_ENABLED=true
            /tmp/bin/bitrise-build-cache-cli -d activate gradle-mirrors

            rm -f "$SAMPLE_PATH/gradle/verification-metadata.xml"
            ./gradlew --write-verification-metadata sha256 help

            cat $GRADLE_VERIFICATION_REF_PATH
            echo "Generated mirror verification xml: $GRADLE_VERIFICATION_REF_PATH"

            mv -f "$GRADLE_VERIFICATION_REF_PATH" "$GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH"
            envman add --key GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH --value "$GRADLE_VERIFICATION_REF_MIRROR_TARGET_PATH"

  check_gradle_verification_reference:
    steps:
    - script@1:
        title: Check if local updates to verification-metadata.xml are not commited
        inputs:
          - content: |-
              set -x

              DIRTY=$(git status --porcelain -- \
                cmd/gradle/asset/verification-metadata.xml \
                cmd/gradle/asset/verification-metadata-mirror.xml)
              if [[ -n "$DIRTY" ]]; then
                echo "Please manually commit the changes to the repo:"
                echo "$DIRTY"
                exit 1
              else
                echo "Verification metadata files have no unstaged changes."
                exit 0
              fi
  generate_and_commit_dependency_matrix:
    steps:
      - script:
          run_if: ".IsCI"
          title: Install pandoc
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                wget https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz
                tar xvzf pandoc-$PANDOC_VERSION-linux-amd64.tar.gz
                sudo mv pandoc-$PANDOC_VERSION/bin/pandoc /usr/local/bin/

                rm -rf pandoc-$PANDOC_VERSION-linux-amd64.tar.gz
                rm -rf pandoc-$PANDOC_VERSION

                pandoc --version
      - script:
          title: Generate dependency matrix
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                bash ./scripts/generate-dependency-matrix.sh
          envs:
            - GH_TOKEN: $GIT_BOT_USER_ACCESS_TOKEN
      - script:
          title: Reformat dependency matrix
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                pandoc --from=markdown --to=gfm --wrap=auto --output cleaned.md docs/dependency-matrix.md
                mv cleaned.md docs/dependency-matrix.md
      - script:
          title: Commit dependency matrix
          inputs:
            - content: |
                #!/bin/bash
                set -ex

                git status
                ls -l docs/dependency-matrix.md
                git stash push -u -m "stash before switching to gh-pages"

                git fetch --all
                git checkout gh-pages

                rm -f docs/dependency-matrix.md
                git stash apply

                if [ ! -f docs/dependency-matrix.md ]; then
                  echo "No dependency matrix found, skipping commit."
                  exit -1
                fi

                if [ -n "$(git status --porcelain)" ]; then
                  echo "Changes detected, committing and pushing to gh-pages branch."

                  git add docs/dependency-matrix.md
                  git diff --cached docs/dependency-matrix.md

                  git commit -m "chore: update dependency matrix"
                  git push origin gh-pages
                else
                  echo "No changes detected, skipping commit."
                  exit 0
                fi

  update-step:
    steps:
      - script:
          title: Create PR for step update
          run_if: true
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex

                ./scripts/update_step.sh
      - slack@4:
          title: Send slack notification about PR
          run_if: '{{ getenv "SLACK_MESSAGE" | ne "" }}'
          inputs:
            - channel: "#team-advanced-ci-alerts-website"
            - text: "$SLACK_MESSAGE"
            - emoji: "$SLACK_EMOJI"
            - color: "$SLACK_COLOR"
            - webhook_url: "$SLACK_WEBHOOK_ALERTS"

pipelines:
  release-and-verify:
    # Tag-triggered. Runs the `release` workflow (build + publish + GAR
    # and R2 mirrors), then `verify-release` (end-to-end smoke against
    # the just-published artifacts + GAR fallback), then `bump-prefix`
    # (staging then production PRs to internal-platform-services).
    # Each workflow is an independent build so they can be re-run individually
    # without re-cutting the tag.
    workflows:
      release: {}
      verify-release:
        depends_on:
        - release
      bump-prefix:
        depends_on:
        - verify-release
    triggers:
      tag:
      - name:
          regex: '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'

  features-e2e:
    # Public CI entry point for PRs. Keeps only the workflows that still
    # live here (test/pr-release-check/ccache/react-seek) and dispatches
    # the migrated e2e suite to build-cache-e2e-testing's `features-e2e`
    # pipeline via dispatch-e2e-cli. The e2e-only secrets stay on the
    # private app so fork PRs can't exfiltrate them.
    # BITRISE_BUILD_CACHE_AUTH_TOKEN (aliased from MONOLITH_API_PAT) is
    # intentionally still exposed on public because the retained
    # workflows above (test, pr-release-check-*, ccache-storage-helper-test,
    # react-seek-*) consume it.
    workflows:
      test: {}
      pr-release-check-linux: {}
      pr-release-check-mac: {}
      ccache-storage-helper-test: {}
      react-seek-android-e2e: {}
      react-seek-ios-e2e: {}
      dispatch-e2e-cli: {}
      # TEMP: RDE smoke tests disabled while the RDE provisioning is failing.
      # rde-mac-local-dx-smoke: {}
      # rde-linux-local-dx-smoke: {}
    triggers:
      pull_request:
        - source_branch: "*"
      push:
        - branch: main
