version: "2"
linters:
  default: all
  disable:
    - cyclop
    - err113
    - exhaustruct
    - funcorder
    - funlen
    - gochecknoinits
    - godot
    - godox
    - ireturn
    - lll
    - mnd
    - noinlineerr
    - nolintlint
    - paralleltest
    - perfsprint
    - revive
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
    - ireturn
  settings:
    depguard:
      rules:
        # docs/auth.md invariant 1: internal/auth is the L0 leaf.
        auth-leaf-imports-nothing:
          files:
            - "**/internal/auth/*.go"
          deny:
            - pkg: github.com/bitrise-io/bitrise-build-cache-cli/v3
              desc: internal/auth is the L0 credential vocabulary and must import no internal package — see docs/auth.md
        # docs/auth.md invariant 4: config/common is not a layer of the auth graph.
        auth-tree-excludes-config-common:
          files:
            - "**/internal/auth/**/*.go"
          deny:
            - pkg: github.com/bitrise-io/bitrise-build-cache-cli/v3/internal/config/common
              desc: no package under internal/auth may import internal/config/common — see docs/auth.md
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - proto/*
      - mocks/*
formatters:
  enable:
  - gci
  - gofmt
  - gofumpt
  - goimports
  settings:
    gci:
      sections:
      - standard # Standard section: captures all standard packages.
      - default # Default section: contains all imports that could not be matched to another section type.
      - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled.
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
