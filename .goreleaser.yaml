# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: bitrise-build-cache

# Based on https://goreleaser.com/customization/release/#github
release:
  github:
    owner: bitrise-io
    name: bitrise-build-cache-cli
  make_latest: true
  draft: false
  mode: append
  replace_existing_artifacts: true
  footer: |
    ### Gradle verification
    For reference, the verification metadata is available as an attached assset.
  extra_files:
    - glob: ./cmd/gradle/asset/verification-metadata.xml
    - glob: ./cmd/gradle/asset/verification-metadata-mirror.xml


before:
  hooks:
    - go mod tidy
    # Pre-build the trampoline per darwin arch into the embed source dir so
    # the CLI binary carries it inline (no runtime R2 download). The build
    # tags on internal/trampoline/download/embed_* only consume the matching
    # arch; non-darwin CLI builds skip it via build tag.
    - sh -c "GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags '-s -w' -o internal/trampoline/download/trampoline_darwin_amd64 ./cmd/trampoline"
    - sh -c "GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags '-s -w' -o internal/trampoline/download/trampoline_darwin_arm64 ./cmd/trampoline"

builds:
  - id: bitrise-build-cache
    binary: bitrise-build-cache
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/bitrise-io/bitrise-build-cache-cli/v3/internal/config/common.injectedVersion={{.Version}}
    goos:
      - linux
      # - windows
      - darwin

archives:
  - id: bitrise-build-cache
    ids:
      - bitrise-build-cache
    name_template: 'bitrise-build-cache_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

# Homebrew formula generation is intentionally NOT handled by goreleaser.
# It is published by a separate, idempotent shell step in bitrise.yml
# (`Publish Homebrew formula (non-fatal)`) that reads dist/checksums.txt
# and pushes Formula/bitrise-build-cache.rb to the tap repo. This avoids
# a second goreleaser invocation that would rebuild + re-upload binaries
# to the existing GH release just to push the formula.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
